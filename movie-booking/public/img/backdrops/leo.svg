<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Leo backdrop">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#212d34"/>
      <stop offset="0.55" stop-color="#07131A"/>
      <stop offset="1" stop-color="#00070e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#25E0C8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#25E0C8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blazeGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6bffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#25E0C8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#25E0C8" stop-opacity="0"/>
