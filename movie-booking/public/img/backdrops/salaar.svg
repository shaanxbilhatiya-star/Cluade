<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Salaar backdrop">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#272729"/>
      <stop offset="0.55" stop-color="#0D0D0F"/>
      <stop offset="1" stop-color="#010103"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B08544" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#B08544" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blazeGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f6cb8a" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#B08544" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#B08544" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.93"/>
    </linearGradient>
    <filter id="clouds">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.02" numOctaves="5" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
  </filter>
  </defs>
  <linearGradient id="sideScrim" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#000000" stop-opacity="0.85"/>
    <stop offset="0.62" stop-color="#000000" stop-opacity="0.15"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
  </linearGradient>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="-6.8" y="-180" width="48.8" height="1080" fill="#B08544" opacity="0.33" transform="rotate(-23.0 640 360)"/>
  <rect x="-169.4" y="-180" width="32.3" height="1080" fill="#B08544" opacity="0.20" transform="rotate(-25.9 640 360)"/>
  <rect x="1310.8" y="-180" width="52.6" height="1080" fill="#B08544" opacity="0.34" transform="rotate(-26.6 640 360)"/>
  <rect x="-370.4" y="-180" width="52.3" height="1080" fill="#B08544" opacity="0.50" transform="rotate(-20.5 640 360)"/>
  <rect x="869.3" y="-180" width="46.4" height="1080" fill="#B08544" opacity="0.32" transform="rotate(-26.1 640 360)"/>
  <rect x="-90.7" y="-180" width="40.2" height="1080" fill="#B08544" opacity="0.17" transform="rotate(-19.5 640 360)"/>
  <rect x="1179.1" y="-180" width="43.0" height="1080" fill="#B08544" opacity="0.37" transform="rotate(-22.8 640 360)"/>
  <ellipse cx="640" cy="302.4" rx="704" ry="288" fill="url(#glow)" opacity="0.55"/>
  <rect width="1280" height="720" fill="url(#sideScrim)"/>
  <rect width="1280" height="720" fill="url(#scrim)" opacity="0.75"/>
  <rect width="1280" height="720" filter="url(#grain)" opacity="0.45"/>
  <text font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="118" font-weight="800" fill="#ffffff" letter-spacing="2"><tspan x="72" y="540">SALAAR</tspan></text>
  <text x="74" y="602" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="30" fill="#ffe9a8" letter-spacing="1.6">Loyalty is a weapon.</text>
  <text x="74" y="648" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#ffffff" fill-opacity="0.78" letter-spacing="3">ACTION   •   DRAMA</text>
</svg>
