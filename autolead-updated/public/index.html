<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruralift — Auto Lead Dialer</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#060b14; color:#e2e8f0; font-family:'Space Grotesk',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .center { text-align:center; padding:24px; }
  .center img { height:56px; margin-bottom:20px; }
  p { color:#4a6080; margin-bottom:40px; font-size:15px; }
  .cards { display:flex; gap:20px; justify-content:center; flex-wrap:wrap; }
  .card { background:#0d1525; border:1px solid #1a2d45; border-radius:16px; padding:38px 48px; text-decoration:none; color:#e2e8f0; transition:all .2s; display:block; }
  .card:hover { border-color:#7c3aed; transform:translateY(-4px); box-shadow:0 8px 28px rgba(124,58,237,.2); }
  .icon { font-size:44px; margin-bottom:14px; }
  .card h2 { font-size:19px; font-weight:700; }
  .card p { color:#4a6080; font-size:13px; margin:6px 0 0; }
</style>
</head>
<body>
<div class="center">
  <img src="/logo.png" alt="Ruralift">
  <p>Auto Lead Dialing System — Support From Emerging India</p>
  <div class="cards">
    <a href="/admin" class="card">
      <div class="icon">🛠️</div>
      <h2>Admin Panel</h2>
      <p>Upload numbers, view stats</p>
    </a>
    <a href="/agent" class="card">
      <div class="icon">📞</div>
      <h2>Agent Dialer</h2>
      <p>Login and start dialing leads</p>
    </a>
  </div>
</div>
</body>
</html>
