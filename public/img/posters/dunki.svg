<svg xmlns="http://www.w3.org/2000/svg" width="500" height="750" viewBox="0 0 500 750" role="img" aria-label="Dunki poster">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#256986"/>
      <stop offset="0.55" stop-color="#0B4F6C"/>
      <stop offset="1" stop-color="#004360"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2A65A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F2A65A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blazeGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffeca0" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#F2A65A" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#F2A65A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.93"/>
    </linearGradient>
    <filter id="clouds">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.02" numOctaves="5" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
  </filter>
  </defs>
