  <text x="250" y="646" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#ffffc5" letter-spacing="1.4">Sister Irene faces the demon again.</text>
