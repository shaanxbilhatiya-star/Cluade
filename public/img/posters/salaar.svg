<svg xmlns="http://www.w3.org/2000/svg" width="500" height="750" viewBox="0 0 500 750" role="img" aria-label="Salaar poster">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#272729"/>
      <stop offset="0.55" stop-color="#0D0D0F"/>
      <stop offset="1" stop-color="#010103"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B08544" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#B08544" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blazeGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f6cb8a" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#B08544" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#B08544" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.93"/>
    </linearGradient>
    <filter id="clouds">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.02" numOctaves="5" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
  </filter>
  </defs>
  <rect width="500" height="750" fill="url(#bg)"/>
  <rect x="303.8" y="-187.5" width="37.0" height="1125" fill="#B08544" opacity="0.34" transform="rotate(-21.7 250 375)"/>
  <rect x="161.8" y="-187.5" width="48.4" height="1125" fill="#B08544" opacity="0.37" transform="rotate(-24.0 250 375)"/>
  <rect x="250.0" y="-187.5" width="45.7" height="1125" fill="#B08544" opacity="0.23" transform="rotate(-19.2 250 375)"/>
  <rect x="228.1" y="-187.5" width="57.4" height="1125" fill="#B08544" opacity="0.42" transform="rotate(-18.8 250 375)"/>
  <rect x="478.1" y="-187.5" width="31.6" height="1125" fill="#B08544" opacity="0.47" transform="rotate(-23.8 250 375)"/>
  <rect x="119.7" y="-187.5" width="22.3" height="1125" fill="#B08544" opacity="0.36" transform="rotate(-26.3 250 375)"/>
  <rect x="362.9" y="-187.5" width="54.5" height="1125" fill="#B08544" opacity="0.12" transform="rotate(-22.1 250 375)"/>
  <ellipse cx="250" cy="315" rx="275" ry="300" fill="url(#glow)" opacity="0.55"/>
  <rect width="500" height="750" fill="url(#scrim)"/>
  <rect width="500" height="750" filter="url(#grain)" opacity="0.5"/>
  <text text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="74" font-weight="800" fill="#ffffff" letter-spacing="1.5" style="paint-order:stroke" stroke="#000000" stroke-opacity="0.35" stroke-width="1.2"><tspan x="250" y="600">SALAAR</tspan></text>
  <text x="250" y="646" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#ffdf9e" letter-spacing="1.4">Loyalty is a weapon.</text>
  <line x1="140" y1="666" x2="360" y2="666" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
  <text x="250" y="696" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" fill="#ffffff" fill-opacity="0.82" letter-spacing="2.6">ACTION  •  DRAMA</text>
  <text x="250" y="726" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#ffffff" fill-opacity="0.55" letter-spacing="1.6">A  |  Telugu  |  175m</text>
</svg>
