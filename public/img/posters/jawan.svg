<svg xmlns="http://www.w3.org/2000/svg" width="500" height="750" viewBox="0 0 500 750" role="img" aria-label="Jawan poster">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#351e20"/>
      <stop offset="0.55" stop-color="#1B0406"/>
      <stop offset="1" stop-color="#0f0000"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E3231F" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#E3231F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blazeGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff6965" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#E3231F" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#E3231F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.93"/>
    </linearGradient>
    <filter id="clouds">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.02" numOctaves="5" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
  </filter>
  </defs>
  <rect width="500" height="750" fill="url(#bg)"/>
  <rect x="-144.6" y="-187.5" width="15.3" height="1125" fill="#E3231F" opacity="0.32" transform="rotate(-21.4 250 375)"/>
  <rect x="376.2" y="-187.5" width="33.4" height="1125" fill="#E3231F" opacity="0.46" transform="rotate(-25.2 250 375)"/>
  <rect x="454.3" y="-187.5" width="17.4" height="1125" fill="#E3231F" opacity="0.33" transform="rotate(-21.0 250 375)"/>
  <rect x="-22.8" y="-187.5" width="18.5" height="1125" fill="#E3231F" opacity="0.20" transform="rotate(-27.4 250 375)"/>
  <rect x="327.7" y="-187.5" width="50.7" height="1125" fill="#E3231F" opacity="0.43" transform="rotate(-18.9 250 375)"/>
  <rect x="446.4" y="-187.5" width="21.1" height="1125" fill="#E3231F" opacity="0.48" transform="rotate(-21.6 250 375)"/>
  <rect x="535.5" y="-187.5" width="18.5" height="1125" fill="#E3231F" opacity="0.47" transform="rotate(-22.3 250 375)"/>
  <ellipse cx="250" cy="315" rx="275" ry="300" fill="url(#glow)" opacity="0.55"/>
  <rect width="500" height="750" fill="url(#scrim)"/>
  <rect width="500" height="750" filter="url(#grain)" opacity="0.5"/>
  <text text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="74" font-weight="800" fill="#ffffff" letter-spacing="1.5" style="paint-order:stroke" stroke="#000000" stroke-opacity="0.35" stroke-width="1.2"><tspan x="250" y="600">JAWAN</tspan></text>
  <text x="250" y="646" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#ff7d79" letter-spacing="1.4">Ready. Aim. Fire.</text>
  <line x1="140" y1="666" x2="360" y2="666" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
  <text x="250" y="696" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" fill="#ffffff" fill-opacity="0.82" letter-spacing="2.6">ACTION  •  THRILLER</text>
  <text x="250" y="726" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#ffffff" fill-opacity="0.55" letter-spacing="1.6">UA  |  Hindi  |  169m</text>
</svg>
