<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B21B6">
<meta name="description" content="CineFlex - book movie tickets, pick your seats and pre-order snacks.">
<title>CineFlex — Movie Tickets</title>
<link rel="icon" href="/img/logo.svg">
<link rel="apple-touch-icon" href="/img/logo.svg">
<link rel="manifest" href="/app.webmanifest">

</head>
<body>

<!-- Shown on desktop: the customer app is a phone-only experience, so we frame it. -->
<div class="desktop-note" aria-hidden="true">
  <img src="/img/logo.svg" alt="" width="40" height="40">
  <div>
    <strong>CineFlex customer app</strong>
    <span>Designed for mobile. Open on a phone, or keep this phone frame.</span>
  </div>
  <a class="desktop-note__admin" href="/admin/">Admin panel &rarr;</a>
</div>

<div class="device">
  <div id="app" class="app">
    <div class="boot">
      <img src="/img/logo.svg" alt="CineFlex" width="64" height="64">
      <div class="boot__spinner" role="status" aria-label="Loading"></div>
    </div>
  </div>
</div>

<div id="toast-host" class="toast-host" aria-live="polite" aria-atomic="true"></div>
<div id="sheet-host" class="sheet-host" hidden></div>

<script src="/js/icons.js?v=20260906"></script>

<script src="/js/screens/account.js?v=20260906"></script>
<script src="/js/screens/booking.js?v=20260906"></script>
<script src="/js/app.js?v=20260906"></script>
